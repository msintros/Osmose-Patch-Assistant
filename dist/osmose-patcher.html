<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osmose Patcher</title>
<style>:root {
  --bg: #15171c; --panel: #1d2027; --panel2: #252933; --line: #343a46; --text: #e6e8ee; --muted: #9aa1b1;
  --accent: #6cb4ff; --audio: #ffa34d; --control: #6cb4ff; --mod: #b48cff; --danger: #ff6b6b; --ok: #4fd18b;
  --node: #262a33; --node-head: #2f3540; --chip: #10131a;
}
:root[data-theme="light"] {
  --bg: #eef0f4; --panel: #ffffff; --panel2: #f3f5f8; --line: #d5d9e2; --text: #1b1f27; --muted: #5d6576;
  --node: #ffffff; --node-head: #e7ebf2; --chip: #ffffff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .45; cursor: default; }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
header .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
header .sep { width: 1px; height: 22px; background: var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.dot.warn { background: #f5c04a; }
#status { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
main { display: grid; grid-template-columns: 210px 1fr 360px; min-height: 0; }
#canvasWrap { position: relative; min-width: 0; overflow: hidden; }
#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
#canvas.panning { cursor: grabbing; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 4px 8px; border-radius: 6px; }
#presetName { position: absolute; left: 12px; bottom: 36px; font-size: 18px; font-weight: 600; pointer-events: none; opacity: .9; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; min-height: 0; }
#palette { border-left: 0; border-right: 1px solid var(--line); padding: 10px 8px; }
#palette input[type=search] { width: 100%; margin: 6px 0 4px; }
#palette .usage { display: flex; flex-direction: column; gap: 1px; font-size: 12px; color: var(--muted); }
#palette .usage b { color: var(--text); font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 600; display: inline-block; min-width: 44px; }
#palette h3.pgroup { cursor: pointer; margin: 12px 0 4px; user-select: none; }
#palette h3.pgroup::before { content: '▸ '; }
#palette h3.pgroup.open::before { content: '▾ '; }
.pitem { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; margin: 0 0 4px; padding: 5px 8px; line-height: 1.25; }
.pitem small { color: var(--muted); font-size: 11px; }
.pitem:disabled small { color: var(--danger); opacity: .9; }
.muted { color: var(--muted); }
.ctl { display: grid; grid-template-columns: 104px 1fr 64px; gap: 6px; align-items: center; margin: 4px 0; }
.ctl label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl input[type=range] { width: 100%; padding: 0; }
.ctl input[type=number] { width: 64px; padding: 2px 4px; }
.follow { margin: -2px 0 6px 110px; font-size: 12px; }
.follow label { color: var(--text); }
aside h2 { font-size: 14px; margin: 0 0 8px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
aside p { margin: 6px 0; color: var(--muted); }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; }
.kv span:nth-child(odd) { color: var(--muted); }
.vgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.vgrid button { padding: 4px 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.vgrid button.sel { background: var(--accent); color: #0b1220; border-color: var(--accent); }
.vgrid button.used { border-color: var(--mod); }
.row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.row label { color: var(--muted); min-width: 74px; }
.row select { flex: 1; min-width: 0; }
.slider { display: grid; grid-template-columns: 74px 1fr 52px; gap: 6px; align-items: center; margin: 4px 0; }
.slider label { color: var(--muted); }
.slider input[type=range] { width: 100%; padding: 0; }
.slider input[type=number] { width: 52px; padding: 2px 4px; }
.comp { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 8px; margin: 8px 0; background: var(--panel2); }
.comp > .title { font-weight: 600; display: flex; justify-content: space-between; }
.comp > .title small { color: var(--muted); font-weight: 400; }
.summary { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: var(--panel2); padding: 6px 8px; border-radius: 6px; }
.note { border-left: 3px solid #f5c04a; padding: 4px 8px; background: var(--panel2); border-radius: 4px; color: var(--muted); margin: 8px 0; }
.list { display: flex; flex-direction: column; gap: 3px; }
.list a { color: var(--accent); cursor: pointer; text-decoration: none; }
#log { background: var(--panel); border-top: 1px solid var(--line); max-height: 34vh; display: flex; flex-direction: column; }
#log.collapsed #logBody { display: none; }
#logBar { display: flex; gap: 8px; align-items: center; padding: 4px 12px; }
#logBar .grow { flex: 1; color: var(--muted); }
#logBody { overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; padding: 0 12px 8px; height: 26vh; }
#logBody div { white-space: pre; }
#logBody .in { color: var(--text); }
#logBody .out { color: var(--accent); }
#logBody .info { color: #f5c04a; }
/* svg */
.node rect.body { fill: var(--node); stroke: var(--line); }
.node.sel rect.body { stroke: var(--accent); stroke-width: 2; }
.node rect.head { fill: var(--node-head); }
.node text { fill: var(--text); font-size: 12px; }
.node text.sub { fill: var(--muted); font-size: 10.5px; }
.node text.sub.warn { fill: #f5c04a; }
.node text.plabel { font-size: 11.5px; fill: var(--text); }
.node text.plabel.unused { fill: var(--muted); opacity: .6; }
.node text.plabel.unknown { font-style: italic; fill: var(--muted); }
.node text.kval { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: var(--muted); }
.node text.kval.set { fill: var(--text); }
.knob { cursor: ns-resize; }
.knob .face { fill: var(--panel2); stroke: var(--line); }
.knob .track { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 2.5; stroke-linecap: round; }
.knob .arc { fill: none; stroke: var(--control); stroke-width: 2.5; stroke-linecap: round; }
.knob .ptr { stroke: var(--text); stroke-width: 2; stroke-linecap: round; }
.knob:hover .face { stroke: var(--accent); }
.knob.blocked { opacity: .35; cursor: not-allowed; }
.port.in.none circle { opacity: .4; }
.node.k-master rect.head { fill: color-mix(in srgb, var(--ok) 22%, var(--node-head)); }
.node.k-osc rect.head { fill: color-mix(in srgb, var(--audio) 18%, var(--node-head)); }
.node.k-bank rect.head { fill: color-mix(in srgb, var(--mod) 20%, var(--node-head)); }
.node.k-sg rect.head { fill: color-mix(in srgb, var(--control) 18%, var(--node-head)); }
.node { cursor: pointer; }
.node rect.headhit { cursor: grab; }
svg.dragging, svg.dragging * { cursor: grabbing !important; }
.port { cursor: crosshair; }
.port circle { stroke: var(--bg); stroke-width: 2; }
.port.in circle { fill: var(--muted); }
.port.out.audio circle { fill: var(--audio); }
.port.out.control circle { fill: var(--control); }
.port:hover circle, .port.hot circle { stroke: var(--text); }
.cable path.vis { fill: none; stroke-width: 2.4; opacity: .85; }
.cable.audio path.vis { stroke: var(--audio); }
.cable.control path.vis { stroke: var(--control); }
.cable.muted path.vis { stroke-dasharray: 5 5; opacity: .4; }
.cable path.hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.cable.sel path.vis { stroke-width: 4; opacity: 1; }
.cable .chip rect { fill: var(--chip); stroke: currentColor; }
.cable.audio .chip { color: var(--audio); }
.cable.control .chip { color: var(--control); }
.cable.sel .chip rect { stroke-width: 2; }
.cable .chip text { fill: var(--text); font: 600 11px ui-monospace, Menlo, Consolas, monospace; }
.cable .chip { cursor: pointer; }
.cable.mod path.vis { stroke: var(--mod); }
.cable.mod .chip { color: var(--mod); }
.port.out.control[data-src^="m:"] circle { fill: var(--mod); }
.node.k-mod rect.head { fill: color-mix(in srgb, var(--mod) 30%, var(--node-head)); }
.node.k-macro rect.head { fill: color-mix(in srgb, #f5c04a 26%, var(--node-head)); }
.hbtn { cursor: pointer; }
.hbtn rect { fill: var(--panel2); stroke: var(--line); }
.hbtn:hover rect { stroke: var(--accent); }
.hbtn text { font-size: 10.5px; fill: var(--text); }
#tip { position: fixed; z-index: 50; max-width: 300px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; opacity: 0; transition: opacity .12s; }
#tip.on { opacity: 1; }
#tip b { display: block; margin-bottom: 2px; }
#tip div { color: var(--muted); }
#dlg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlgcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(560px, 100%); max-height: 88vh; display: flex; flex-direction: column; }
.dlghead { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlghead h2 { font-size: 15px; margin: 0; }
.dlgbody { overflow-y: auto; padding: 8px 14px 14px; }
.dlgbody h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
.dlgbody p { color: var(--muted); margin: 6px 0; }
.tabs { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
.tabs button.sel { background: var(--accent); color: #0b1220; border-color: var(--accent); }
svg.graph { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; cursor: crosshair; touch-action: none; display: block; }
svg.graph .bar { fill: var(--accent); }
svg.graph .bar.off { fill: var(--muted); opacity: .35; }
svg.graph .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.tempcable { fill: none; stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 4; pointer-events: none; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr 45vh; }
  #palette { max-height: 22vh; border-right: 0; border-bottom: 1px solid var(--line); }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
.ctl.wide { grid-template-columns: 136px 1fr 64px; }

/* Right-click menu on the canvas */
.ctxmenu { position: absolute; z-index: 20; min-width: 150px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.35); font-size: 13px; }
.ctxmenu.sub { min-width: 190px; max-height: 70vh; overflow-y: auto; }
.ctxhead { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px 5px; }
.ctxcat { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-radius: 5px; cursor: default; user-select: none; }
.ctxcat .arrow { color: var(--muted); }
.ctxcat.open, .ctxcat:hover { background: var(--panel2); }
.ctxgroup { color: var(--muted); font-size: 11px; padding: 6px 8px 2px; }
.ctxitem { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 5px; }
.ctxitem:hover:not(:disabled) { background: var(--panel2); }
.ctxitem:disabled { color: var(--muted); opacity: .6; }
.ctl.assign { grid-template-columns: 118px 1fr 64px; }
.ctl.assign select { width: 100%; min-width: 0; padding: 2px 4px; font-size: 12px; }
.small { font-size: 12px; margin: 2px 0 6px; }
.ctxsep { height: 1px; background: var(--line); margin: 4px 6px; }
main.nopal { grid-template-columns: 1fr 360px; }
main.nopal #palette { display: none; }
#paletteBtn.on { background: color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
@media (max-width: 820px) { main.nopal { grid-template-columns: 1fr; grid-template-rows: 1fr 45vh; } }
</style>
</head>
<body>
<header>
  <h1>Osmose Patcher</h1>
  <div class="group">
    <span id="dot" class="dot"></span>
    <label>In <select id="inSel"></select></label>
    <label>Out <select id="outSel"></select></label>
    <button id="connectBtn" class="primary">Connect</button>
    <button id="readBtn" title="Ask the Osmose to send its current patch">Read patch</button>
    <label title="Send the Editor's once-a-second 'editor present' ping"><input type="checkbox" id="hbChk" checked> Heartbeat</label>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label title="Which message format to speak. Auto picks from the firmware version the device reports.">Protocol
      <select id="dialectSel">
        <option value="auto">Auto</option>
        <option value="legacy">Legacy (Osmose, fw 10.09)</option>
        <option value="modern">Modern (fw 10.3x+)</option>
      </select></label>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="paletteBtn" title="Show or hide the module list on the left (right-clicking the canvas also adds modules)">Module list</button>
    <button id="openBtn" title="Open a saved patch (.json) or a Haken preset file (.mid)">Open…</button>
    <input type="file" id="fileIn" accept=".json,.mid" hidden>
    <button id="saveBtn">Save…</button>
    <button id="pushBtn" title="Send the whole patch shown here to the Osmose">Send all to Osmose</button>
    <button id="demoBtn">Demo patch</button>
    <button id="newBtn">Clear</button>
    <button id="layoutBtn" title="Reset module positions and zoom">Reset layout</button>
    <button id="themeBtn" title="Light / dark">◐</button>
  </div>
  <span id="status"></span>
</header>
<main>
  <aside id="palette"></aside>
  <div id="canvasWrap">
    <svg id="canvas"></svg>
    <div id="presetName"></div>
    <div id="hint"><span id="devinfo"></span></div>
  </div>
  <aside id="inspector"></aside>
</main>
<section id="log">
  <div id="logBar">
    <button id="logToggle">MIDI log</button>
    <span class="grow">Every message in and out. If something does not work on your Osmose, press “Save capture” and send the file.</span>
    <label><input type="checkbox" id="logFilter" checked> Hide notes</label>
    <button id="logPause">Pause</button>
    <button id="logClear">Clear</button>
    <button id="logSave">Save capture</button>
  </div>
  <div id="logBody"></div>
</section>
<script>/* EaganMatrix live-editing protocol: tables, decoder, encoder. No I/O.
 *
 * Sources (see docs/PROTOCOL.md for detail):
 *  - Haken Audio's HakenMidi.h (the protocol header the Haken Editor and third-party
 *    front ends use), as published in pachde-CHEM src/em/HakenMidi.h.
 *  - Device-verified notes on fw 10.81 from the eagan_mcp project (EaganMatrix Module).
 *  - The "legacy" (pre-10.3x) layout, inferred from older preset archives by eagan_mcp's
 *    preset_file.py. The Osmose runs DSP firmware 10.09, so this is the layout it most
 *    likely speaks. It is NOT yet verified on an Osmose.
 *
 * Two dialects:
 *   modern : ch16 cc40 row / cc41 col / cc43,cc42 decimals / cc44 value / cc45 matOp,
 *            formulas via ch16 cc56=19 + poly-pressure (id,value) pokes, setup via cc56=20.
 *   legacy : ch15 cc102 row / cc103 col / cc116,cc115 decimals / cc104 value / cc110 matOp,
 *            formulas = ch15 cc34 formula#, then bare ch15 cc (some fields packed),
 *            setup ids 64..99 = ch15 cc, ids 35..63 = ch16 cc.
 */
(function (root) {
  'use strict';

  const CH1 = 0, CH15 = 14, CH16 = 15;
  const CC = 0xB0, POLY = 0xA0, CHPRESS = 0xD0, PROG = 0xC0;

  // ---------------------------------------------------------------- matrix layout
  const ROW_NAMES = ['Noise', 'Osc/Filter 1', 'Osc/Filter 2', 'Osc/Filter 3', 'Osc/Filter 4',
    'Osc/Filter 5', 'Bank A', 'Bank B', 'Bank C', 'Audio In L', 'Audio In R', 'Submix L',
    'Submix R', 'Direct +', 'Direct + (2)', 'Direct −', 'Multiply ×'];
  const N_ROWS = 17, N_COLS = 61;

  const COL_NAMES = [];
  ['Master L in', 'Master R in', 'Master col 1', 'Master col 2', 'Master col 3', 'Master col 4',
    'Master col 5', 'Master col 6', 'Master/Dry mix', 'Dry L', 'Dry R', '(separator)']
    .forEach((n, i) => { COL_NAMES[i] = n; });
  for (let k = 0; k < 5; k++) {
    COL_NAMES[12 + 3 * k] = `Osc/Filter ${k + 1} In`;
    COL_NAMES[13 + 3 * k] = `Osc/Filter ${k + 1} F`;
    COL_NAMES[14 + 3 * k] = `Osc/Filter ${k + 1} B`;
  }
  ['A', 'B', 'C'].forEach((b, bi) => {
    for (let i = 0; i < 8; i++) COL_NAMES[27 + 8 * bi + i] = `Bank ${b} col ${i + 1}`;
  });
  for (let k = 0; k < 5; k++) {
    COL_NAMES[51 + 2 * k] = `SG ${k + 1} F`;
    COL_NAMES[52 + 2 * k] = `SG ${k + 1} T`;
  }

  // ---------------------------------------------------------------- cell values
  // Modern ccMatVal codes (HakenMidi.h SSL_ccMatVal). Bit 6 (64) = muted.
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUV'.split('');
  const VALUE_LABELS = [''];
  LETTERS.forEach(l => VALUE_LABELS.push(l));          // 1..22
  LETTERS.forEach(l => VALUE_LABELS.push(l + "'"));    // 23..44 (fw 10.30+)
  VALUE_LABELS.push('W', 'X', 'Y', 'z²', '.');          // 45..49 (49 = decimal)
  for (let n = 1; n <= 9; n++) VALUE_LABELS.push(String(n)); // 50..58
  VALUE_LABELS.push('row²', 'row³');                    // 59, 60
  const CODE = { NC: 0, A: 1, V: 22, A_: 23, W: 45, X: 46, Y: 47, ZZ: 48, DEC: 49, ONE: 50, SQ: 59, CU: 60, MUTE: 64 };
  const VALUE_HELP = {
    W: 'Gate: 1 while a key is down', X: 'Pitch (kHz of the played note)', Y: 'Y (Osmose: aftertouch zone)',
    'z²': 'Pressure squared', 'row²': 'Square of the row signal', 'row³': 'Cube of the row signal',
  };
  const isFormulaCode = c => c >= 1 && c <= 44;
  const formulaLetter = n => (n >= 1 && n <= 44) ? VALUE_LABELS[n] : `#${n}`;

  // Legacy firmware has no A'..V', so every code from 23 up sits 22 lower.
  const LEGACY_SHIFT_FROM = 23, LEGACY_SHIFT = 22;
  function legacyToModernCode(v) {
    const mute = v & 64; let c = v & 63;
    if (c >= LEGACY_SHIFT_FROM) c += LEGACY_SHIFT;
    return c | mute;
  }
  function modernToLegacyCode(v) {
    const mute = v & 64; let c = v & 63;
    if (c >= 23 && c <= 44) throw new Error("A'..V' formulas need firmware 10.30 or later");
    if (c >= 45) c -= LEGACY_SHIFT;
    return c | mute;
  }

  /** A cell value: {code, dec} where dec is 1..9999 (only for code 49). */
  function cellLabel(cell) {
    if (!cell) return '';
    const c = cell.code & 63;
    if (c === CODE.DEC) return ('.' + String(cell.dec || 0).padStart(4, '0')).replace(/0+$/, '') || '.0';
    return VALUE_LABELS[c] ?? `?${c}`;
  }
  /** Parse user text -> {code, dec}. Throws on bad input. */
  function parseCellValue(text) {
    let t = String(text).trim();
    if (!t) return { code: 0, dec: 0 };
    const u = t.toUpperCase();
    let i = VALUE_LABELS.findIndex((l, k) => k > 0 && k !== 49 && l.toUpperCase() === u);
    if (i > 0) return { code: i, dec: 0 };
    if (u === 'Z2' || u === 'ZZ' || u === 'Z^2') return { code: CODE.ZZ, dec: 0 };
    if (u === 'ROW2' || u === 'ROW^2') return { code: CODE.SQ, dec: 0 };
    if (u === 'ROW3' || u === 'ROW^3') return { code: CODE.CU, dec: 0 };
    if (/^0?\.\d{1,4}$/.test(t)) {
      const d = parseInt(t.split('.')[1].padEnd(4, '0'), 10);
      if (d === 0) return { code: 0, dec: 0 };
      return { code: CODE.DEC, dec: d };
    }
    throw new Error(`"${text}" is not a matrix value. Use A–V, W, X, Y, z², 1–9, a decimal like .25, row², row³.`);
  }

  // ---------------------------------------------------------------- formulas (s_Form_Poke ids)
  const F = {
    MultX: 1, MultY: 2, MultZ: 3, InitX: 4, InitY: 5, InitZ: 6, AncDom: 7, AncNN: 10,
    NegW: 13, NegBegX: 15, NegEndX: 17, NegBegY: 19, NegEndY: 21, NegBegZ: 23, NegEndZ: 25,
    XMacr: 27, YMacr: 28, ZMacr: 29, FormOp: 38, Blend: 39, SgW: 40, MultW: 41, HeightW: 42,
    HBegX: 43, ZeroX: 44, VBegX: 45, VEndX: 46, Interp: 48, HEndX: 49, ShapeW: 50, VBegY: 51,
    VEndY: 52, HBegY: 53, HEndY: 54, TransY: 55, AncOp: 56, AncVal: 57, VBegZ: 58, VEndZ: 59,
    HBegZ: 60, HEndZ: 61, TransZ: 62, Persist: 63, ScaleW: 66, SWMacr: 67, BlMacForm: 68,

  };
  const SIGN_OF = { 42: 13, 73: 14, 45: 15, 75: 16, 46: 17, 76: 18, 51: 19, 77: 20, 52: 21, 78: 22, 58: 23, 79: 24, 59: 25, 80: 26 };
  const FORMULA_DEFAULTS = { [F.MultW]: 3, [F.MultX]: 3, [F.MultY]: 3, [F.MultZ]: 3, [F.HEndX]: 12, [F.HEndY]: 12, [F.HEndZ]: 12, [F.TransX]: 1, [F.ZeroX]: 60, [F.Interp]: 40 };

  const OPTIONS = {
    op: ['W + X + Y + Z', 'W × (X + Y + Z)', '(W + X + Y) × Z', '(W + X) × (Y + Z)', '(W × X) + (Y × Z)'],
    wMode: ['Constant', 'Gated (key down)', 'SG 1', 'SG 2', 'SG 3', 'SG 4', 'SG 5', 'SG 1b', 'SG 2b', 'SG 3b', 'SG 4b', 'SG 5b', 'Formula Delay tap', 'RMS of row'],
    mult: ['× 0.001', '× 0.01', '× 0.1', '× 1', '× 10', '× 100', '× 1000'],
    multVal: [0.001, 0.01, 0.1, 1, 10, 100, 1000],
    wScale: ['× 1', '× Macro', '× 127 × Macro', '÷ fingers', '× voice #', '1 if voice 1', '÷ polyphony'],
    macro: ['i', 'ii', 'iii', 'iv', 'v', 'vi'].concat(Array.from({ length: 84 }, (_, i) => 'm' + (i + 7))),

    xyMode: ['Continuous', 'Initial', 'Derivative', 'Relative', 'Continuous (no trim)', 'Initial (no trim)', 'Derivative (no trim)', 'Relative (no trim)'],
    zMode: ['Continuous', 'Initial', 'Derivative', 'Release (fast)', 'Release (pressure)'],
    xTrans: ['Octaves', 'kHz', 'Linear', 'Gentle S', 'Squared', 'Square root', '2 step', '3 step', 'Graph', 'Offsets 1', 'Offsets 2', 'Steep S'],
    yzTrans: ['Linear', 'Gentle S', 'Squared', 'Square root', '2 step', '3 step', 'Graph', 'Offsets 1', 'Offsets 2', 'Steep S'],
  };
  const COMPONENTS = {
    X: { vBeg: F.VBegX, vEnd: F.VEndX, hBeg: F.HBegX, hEnd: F.HEndX, mult: F.MultX, mode: F.InitX, trans: F.TransX, macro: F.XMacr },
    Y: { vBeg: F.VBegY, vEnd: F.VEndY, hBeg: F.HBegY, hEnd: F.HEndY, mult: F.MultY, mode: F.InitY, trans: F.TransY, macro: F.YMacr },
    Z: { vBeg: F.VBegZ, vEnd: F.VEndZ, hBeg: F.HBegZ, hEnd: F.HEndZ, mult: F.MultZ, mode: F.InitZ, trans: F.TransZ, macro: F.ZMacr },

  const fget = (p, id) => (p[id] !== undefined ? p[id] : (FORMULA_DEFAULTS[id] ?? 0));

  function heightGet(p, id) {

    if (v < 0) { p[SIGN_OF[id]] = 1; p[id] = Math.round((v + 1) * 100); }
    else { p[SIGN_OF[id]] = 0; p[id] = Math.min(127, Math.round(v * 100)); }
  }

  function formulaSummary(p) {
    if (!p) return '(not loaded)';
    const parts = [];
    const wMode = fget(p, F.SgW), wH = heightGet(p, F.HeightW), wM = OPTIONS.multVal[fget(p, F.MultW) & 7];
    if (wH !== 0) {
      let s = `W ${OPTIONS.wMode[wMode] || '?'} ${wH}`;
      if (wM !== 1) s += `×${wM}`;
      if (wMode >= 2 && wMode <= 11) s += ` [${OPTIONS.sgShape[fget(p, F.ShapeW)] || 'S&H'}]`;
      const sc = fget(p, F.ScaleW); if (sc) s += ` ${OPTIONS.wScale[sc]}${sc <= 2 ? ' ' + OPTIONS.macro[fget(p, F.SWMacr)] : ''}`;
      parts.push(s);
    }
    for (const k of ['X', 'Y', 'Z']) {
      const c = COMPONENTS[k];
      const b = heightGet(p, c.vBeg), e = heightGet(p, c.vEnd);
      if (b === 0 && e === 0) continue;
      const m = OPTIONS.multVal[fget(p, c.mult) & 7];
      parts.push(`${k} ${b}→${e}${m !== 1 ? '×' + m : ''}`);
    }
    const op = fget(p, F.FormOp);
    if (op) parts.push(OPTIONS.op[op]);
    return parts.length ? parts.join(' · ') : 'zero (no effect yet)';
  }

  // ---- legacy formula packing (derived from archives; see eagan_mcp preset_file.py)
  const LEGACY_PACK = {
    39: [[F.BlMacForm, 0, 3], [F.Blend, 3, 4]],
    40: [[F.SgW, 0, 4], [F.InitW, 4, 1], [F.AllW, 5, 1]],
    41: [[F.MultW, 0, 3], ['scaler', 3, 4]],
    43: [[F.HBegX, 0, 4], [F.MultX, 4, 3]],
    49: [[F.HEndX, 0, 4], [F.InitX, 4, 3]],
    53: [[F.HBegY, 0, 4], [F.MultY, 4, 3]],
    54: [[F.HEndY, 0, 4], [F.InitY, 4, 3]],
    56: [[F.AncOp, 0, 4], [F.AncDom, 4, 3]],
    60: [[F.HBegZ, 0, 4], [F.MultZ, 4, 3]],
    61: [[F.HEndZ, 0, 4], [F.InitZ, 4, 3]],
  };
  const NEG_PRIMARY = [13, 15, 17, 19, 21, 23, 25];   // cc71, MSB first
  const NEG_SECONDARY = [14, 16, 18, 20, 22, 24, 26]; // cc72
  const LEGACY_CONSUMED = new Set([...NEG_PRIMARY, ...NEG_SECONDARY, F.ScaleW, F.SWMacr, F.AncNN]);
  Object.values(LEGACY_PACK).forEach(fs => fs.forEach(([id]) => { if (typeof id === 'number') LEGACY_CONSUMED.add(id); }));
  const LEGACY_MATRIX_CC = new Set([102, 103, 104, 110, 115, 116]);

  /** Legacy ch15 cc map -> modern pairs. */
  function legacyUnpack(raw) {
    const p = {};
    for (const [ccs, value] of Object.entries(raw)) {
      const cc = +ccs;
      if (LEGACY_PACK[cc]) {
        for (const [id, shift, width] of LEGACY_PACK[cc]) {
          const field = (value >> shift) & ((1 << width) - 1);
          if (id === 'scaler') {
            // 1..6 = "× macro i..vi"; higher values are not understood yet, so leave them alone.
            if (field >= 1 && field <= 6) { p[F.ScaleW] = 1; p[F.SWMacr] = field - 1; } else if (!field) { p[F.ScaleW] = 0; }
          } else p[id] = field;
        }
      } else if (cc === 71 || cc === 72) {
        const ids = cc === 71 ? NEG_PRIMARY : NEG_SECONDARY;
        ids.forEach((id, bit) => { p[id] = (value >> (6 - bit)) & 1; });
      } else if (cc === F.AncVal) {
        p[F.AncNN] = (value & 64) ? 1 : 0; p[F.AncVal] = value & 63;
      } else p[cc] = value;
    }
    return p;
  }
  /** Modern pairs -> legacy ch15 cc map (complete). */
  function legacyPack(p) {
    const out = {};
    for (const [cc, fields] of Object.entries(LEGACY_PACK)) {
      let v = 0;
      for (const [id, shift, width] of fields) {
        let field;
        if (id === 'scaler') field = fget(p, F.ScaleW) === 1 ? Math.min(15, fget(p, F.SWMacr) + 1) : 0;
        else field = fget(p, id);
        v |= (field & ((1 << width) - 1)) << shift;
      }
      out[cc] = v & 127;
    }
    out[71] = NEG_PRIMARY.reduce((a, id, bit) => a | ((fget(p, id) & 1) << (6 - bit)), 0);
    out[72] = NEG_SECONDARY.reduce((a, id, bit) => a | ((fget(p, id) & 1) << (6 - bit)), 0);
    out[F.AncVal] = (fget(p, F.AncVal) & 63) | (fget(p, F.AncNN) ? 64 : 0);
    for (const [ids, v] of Object.entries(p)) {
      const id = +ids;
      if (LEGACY_CONSUMED.has(id) || id === F.AncVal || LEGACY_MATRIX_CC.has(id) || id === 34) continue;
      out[id] = v & 127;
    }
    return out;
  }

  // ---------------------------------------------------------------- setup (s_Mat_Poke ids)
  const SETUP = { Poly: 39, MastCol1: 27, OscType1: 72, OscOpt1: 77, BankA: 91, BankB: 92, BankC: 93, SgType1: 100 };
  const OSC_TYPES = { 0: 'DSF oscillator', 1: 'Integrated DSF osc', 18: 'PWM oscillator', 2: 'Jenny oscillator', 3: 'Phase oscillator', 4: 'Seeded noise', 5: 'Low pass', 6: 'High pass', 7: 'Band pass', 8: 'Band reject', 9: 'All pass', 10: 'Low shelf', 11: 'High shelf', 12: 'Low pass 1-pole', 13: 'High pass 1-pole', 19: 'Ladder low pass', 14: 'Multiplier', 15: 'tanh', 16: 'Bit crush', 17: 'Granulate delay' };
  const BANK_AB_TYPES = { 0: 'BiqBank', 1: 'BiqGraph', 2: 'BiqMouth', 3: 'SineBank', 4: 'SineSpray', 5: 'WaveBank', 6: 'HarMan', 7: 'ModMan', 8: 'CVC', 9: 'Kinetic', 10: 'Additive' };
  const BANK_C_TYPES = { 0: 'Voice Delay', 1: 'Summed Delay', 2: 'Micro Delay', 3: 'Formula Delay', 4: 'SineSpray', 5: 'WaveBank', 6: 'HarMan', 8: 'CVC' };
  const SG_TYPES = { 0: 'Continuous cycle', 1: 'Single cycle', 2: 'Phase from row', 3: 'Dual' };
  // Column labels by bank type (guide sections 6.x; first columns are fixed, the rest assignable).
  const BANK_COL_LABELS = {
    BiqBank: ['In', 'F', '3', '4', '5', '6', '7', '8'], SineBank: ['Amp', 'F', '3', '4', '5', '6', '7', '8'],
    Kinetic: ['In', 'F', '3', '4', '5', '6', '7', '8'],
  };

  // ---------------------------------------------------------------- global cc (sent on ch1; devices report on ch1 or ch16)
  const GLOBAL_CC = { Post: 18, AudIn: 19, Reci1: 20, Reci2: 21, Reci3: 22, Reci4: 23, ReciMix: 24, Pre: 26,
    EqTilt: 83, EqFreq: 84, EqMix: 85, ThrDrv: 90, AtkCut: 91, RatMkp: 92, CoThMix: 93, Reci5: 95, Reci6: 96 };
  const GLOBAL_CC_SET = new Set(Object.values(GLOBAL_CC));
  // Macro i..vi are 0..1 (14-bit, full scale 0x3F80); m7..m90 are -1..1 (14-bit, zero 0x2000).
  const macroName = i => i < 6 ? ['i', 'ii', 'iii', 'iv', 'v', 'vi'][i] : 'm' + (i + 1);
  const macroToValue = (i, raw) => i < 6 ? raw / 0x3F80 : (raw - 0x2000) / 0x2000;
  const macroFromValue = (i, v) => i < 6 ? Math.max(0, Math.min(0x3FFF, Math.round(v * 0x3F80))) : Math.max(0, Math.min(0x3FFF, Math.round(v * 0x2000) + 0x2000));
  /** Macro index -> [frac cc, value cc] on ch1 (see HakenMidi.h ccFracIM48 / ccFracM49M90). */
  function macroCcs(i) {
    if (i < 6) return [86, 12 + i];
    const n = i + 1;                          // m7..m90
    if (n <= 30) return [86, 40 + n - 7];
    if (n <= 48) return [86, 102 + n - 31];
    if (n <= 72) return [97, 40 + n - 49];

  }

  // ---------------------------------------------------------------- state
  function newState() {
    return {
      cells: new Map(),      // key row*64+col -> {code, dec}
      formulas: {},          // num -> {pairs:{id:value}, legacyRaw?:{cc:v}}
      setup: {},             // s_Mat_Poke id -> value
      name: '', text: '', firmware: null, hardware: null, presetId: null,
      kinet: [],             // Kinetic properties (stream 11), 24 bytes per bank: A at 0, B at 24
      biqsin: [],            // BiqBank/SineBank properties (stream 12), same layout
      legacyRaw: { 15: {}, 16: {} }, // older-firmware settings by channel and cc, replayed as-is
      graphs: { 2: [], 3: [], 4: [] },  // BiqGraph graphs: 2 = mode amplitudes, 3 / 4 = offset graphs (48 values 0..96)
      conv: [],              // convolution settings (stream 14)
      detune: {},            // app only: per-column detune (kHz) included in the column's dial constant
      globals: {},           // Master section and other global cc (pre, post, recirculator, EQ, compressor) by cc number
      macros: {},            // macro index 0..89 (i = 0) -> 14-bit raw value

  const unkey = k => [Math.floor(k / 64), k % 64];

  // ---------------------------------------------------------------- decoder
  /** Feeds raw MIDI bytes; mutates `state`; calls onEvent({type,...}). */
  class Decoder {
    constructor(state, onEvent) {
      this.s = state; this.on = onEvent || (() => {});
      this.dialect = 'auto';   // 'auto' | 'modern' | 'legacy'
      this.pending = [];       // messages buffered until the dialect is known
      this.m = { row: 0, col: 0, hi: 0, lo: 0 };   // modern matrix cursor
      this.l = { row: 0, col: 0, hi: 0, lo: 0, form: null }; // legacy cursor
      this.stream = null; this.formSel = null; this.textBuf = [];
      this.fwHi = null;
    }
    setDialect(d) { this.dialect = d; if (d !== 'auto') this._flush(); }
    _decide(d, why) {
      if (this.dialect !== 'auto') return;
      this.dialect = d; this.on({ type: 'dialect', dialect: d, why }); this._flush();
    }
    _flush() { const p = this.pending; this.pending = []; p.forEach(m => this._handle(m)); }

    feed(bytes) {
      const st = bytes[0] & 0xF0, ch = bytes[0] & 0x0F;
      if (this.dialect === 'auto') {
        // Version first: it settles the dialect outright.
        if (st === CC && ch === CH16 && bytes[1] === 102) this.fwHi = bytes[2];
        if (st === CC && ch === CH16 && bytes[1] === 103 && this.fwHi !== null) {
          const fw = (this.fwHi << 7) | bytes[2];
          this._decide(fw >= 1030 ? 'modern' : 'legacy', `firmware ${fmtFw(fw)}`);
        } else if (st === CC && ch === CH15 && (bytes[1] === 102 || bytes[1] === 103 || bytes[1] === 104)) {
          this._decide('legacy', 'matrix data seen on channel 15');
        } else if (st === CC && ch === CH16 && bytes[1] === 45 && (bytes[2] === 125 || bytes[2] === 126)) {
          this._decide('modern', 'matrix start on channel 16');
        } else if (st === POLY && ch === CH16) {
          this._decide('modern', 'stream data as poly pressure');
        }
        if (this.dialect === 'auto') { this.pending.push(bytes); if (this.pending.length > 20000) this.pending.shift(); this._handleCommon(bytes); return; }
      }
      this._handle(bytes);
    }

    // Messages whose meaning does not depend on the dialect (safe to act on before deciding).
    _handleCommon(b) {
      const st = b[0] & 0xF0, ch = b[0] & 0x0F;
      if (st !== CC || ch !== CH16) return;
      const [, cc, v] = b;
      if (cc === 102) this.s._fwHi = v;
      if (cc === 103 && this.s._fwHi !== undefined) { this.s.firmware = (this.s._fwHi << 7) | v; this.on({ type: 'firmware', firmware: this.s.firmware }); }
      if (cc === 104) { this.s.hardware = (v >> 2) & 31; this.on({ type: 'hardware', hardware: this.s.hardware }); }
      if (cc === 118) this.on({ type: 'pong' });
    }

    /** Global cc: Master settings and macros, reported on ch1 (live) or ch16 (preset load). */
    _global(ch, cc, v) {
      if (cc === 86 || cc === 97) { this.frac = { cc, v }; return true; }
      let idx = null;
      if (cc >= 12 && cc <= 17) idx = cc - 12;
      else if (ch === CH1 && this.frac && cc >= 40 && cc <= 63) idx = (this.frac.cc === 86 ? 6 : 48) + cc - 40;
      else if (ch === CH1 && this.frac && cc >= 102 && cc <= 119) idx = (this.frac.cc === 86 ? 30 : 72) + cc - 102;
      if (idx !== null) {
        const lo = this.frac ? this.frac.v : 0; this.frac = null;
        this.s.macros[idx] = (v << 7) | lo; this.on({ type: 'macro', index: idx });
        return true;
      }
      if (GLOBAL_CC_SET.has(cc)) { this.s.globals[cc] = v; this.on({ type: 'global', cc }); return true; }
      return false;
    }

    _handle(b) {
      const st = b[0] & 0xF0, ch = b[0] & 0x0F;
      if (ch === CH1 && st === CC) { this._global(CH1, b[1], b[2]); return; }
      if (ch === CH16) {
        if (st === CC) {
          this._handleCommon(b);
          if ((b[1] >= 12 && b[1] <= 26) || (b[1] >= 83 && b[1] <= 97 && b[1] !== 87 && b[1] !== 88 && b[1] !== 89)) { if (this._global(CH16, b[1], b[2])) return; }
          return this.dialect === 'legacy' ? this._ch16CcLegacy(b[1], b[2]) : this._ch16CcModern(b[1], b[2]);
        }
        if (st === POLY) return this._sData([b[1], b[2]]);
        if (st === CHPRESS) return this._sData([b[1]]);
        if (st === PROG) { this.on({ type: 'program', program: b[1] }); return; }
      }
      if (ch === CH15 && st === CC && this.dialect === 'legacy') return this._ch15CcLegacy(b[1], b[2]);
    }

    _clearAll() {
      this.s.cells.clear(); this.s.formulas = {}; this.l.form = null; this.formSel = null;
      this.on({ type: 'clear' });
    }
    _setCell(r, c, code, dec) {
      if (r < 0 || r >= N_ROWS || c < 0 || c >= N_COLS || c === 11) return;
      const k = key(r, c);
      if ((code & 63) === 0) this.s.cells.delete(k);
      else this.s.cells.set(k, { code, dec: (code & 63) === CODE.DEC ? dec : 0 });
      this.on({ type: 'cell', row: r, col: c });
    }

    _ch16CcModern(cc, v) {
      const m = this.m;
      switch (cc) {
        case 40: m.row = v; break;
        case 41: m.col = v; break;
        case 43: m.hi = v; m.lo = 0; break;
        case 42: m.lo = v; break;
        case 44: this._setCell(m.row, m.col, v, m.hi * 100 + m.lo); m.hi = m.lo = 0; break;
        case 45:
          if (v === 125) this._clearAll();
          else if (v >= 103 && v <= 105) this._clearCols(27 + 8 * (v - 103), 35 + 8 * (v - 103));
          else if (v === 124) this.on({ type: 'refreshEnd' });
          break;
        case 34: this.formSel = v; this.on({ type: 'formSel', formula: v }); break;
        case 56: this._streamSelect(v); break;
      }
    }
    _ch16CcLegacy(cc, v) {
      if (cc === 56) return this._streamSelect(v);
      if (cc >= 35 && cc <= 63 && cc !== 56 && cc !== 57) this.s.legacyRaw[16][cc] = v;
      if (cc === 62) { this.s.setup[62] = v & 7; this.on({ type: 'setup', id: 62 }); }   // recirculator type (+64 = extend), inferred
    }
    _ch15CcLegacy(cc, v) {
      const l = this.l;
      switch (cc) {
        case 102: l.row = v; return;
        case 103: l.col = v; return;
        case 116: l.hi = v; l.lo = 0; return;
        case 115: l.lo = v; return;
        case 104: this._setCell(l.row, l.col, legacyToModernCode(v), l.hi * 100 + l.lo); l.hi = l.lo = 0; return;
        case 110:
          if (v === 125) this._clearAll();
          else if (v >= 103 && v <= 105) this._clearCols(27 + 8 * (v - 103), 35 + 8 * (v - 103));
          return;
        case 34: l.form = v; this._formula(v); this.on({ type: 'formSel', formula: v }); return;
      }
      if (l.form !== null) {
        const f = this._formula(l.form);
        f.legacyRaw = f.legacyRaw || {};
        f.legacyRaw[cc] = v;
        f.pairs = legacyUnpack(f.legacyRaw);
        this.on({ type: 'formula', formula: l.form });
      } else if (LEGACY_SETUP_OK.has(cc)) {
        this.s.setup[cc] = v; this.on({ type: 'setup', id: cc });
      } else {
        // Other older-firmware settings: their numbering does not match the modern ids, so keep them raw.
        this.s.legacyRaw[15][cc] = v;
      }
    }
    _clearCols(a, b) {
      for (const k of [...this.s.cells.keys()]) { const c = k % 64; if (c >= a && c < b) this.s.cells.delete(k); }
      this.on({ type: 'clear' });
    }
    _formula(n) { return this.s.formulas[n] || (this.s.formulas[n] = { pairs: {} }); }

    _streamSelect(v) {
      this._endText();
      this.stream = v === 127 ? null : v;
      if (v === 0 || v === 1) this.textBuf = [];
      if (v === 11) this.s.kinet = [];
      if (v === 12) this.s.biqsin = [];
      if (v >= 2 && v <= 4) this.s.graphs[v] = [];
      if (v === 14) this.s.conv = [];
      if (v === 16 || v === 17) this.macroStream = [];
    }
    _endText() {
      if (this.stream === 0 || this.stream === 1) {
        const t = String.fromCharCode(...this.textBuf.filter(c => c >= 32 || c === 10)).trim();
        if (this.stream === 0) { this.s.name = t; this.on({ type: 'name', name: t }); }
        else { this.s.text = t; this.on({ type: 'text' }); }
      }
      this.textBuf = [];
    }
    _sData(bytes) {
      switch (this.stream) {
        case 0: case 1: this.textBuf.push(...bytes); break;
        case 19: if (bytes.length === 2 && this.formSel) { this._formula(this.formSel).pairs[bytes[0]] = bytes[1]; this.on({ type: 'formula', formula: this.formSel }); } break;
        case 20: if (bytes.length === 2) { this.s.setup[bytes[0]] = bytes[1]; this.on({ type: 'setup', id: bytes[0] }); } break;
        case 11: this.s.kinet.push(...bytes); this.on({ type: 'props', stream: 'kinet' }); break;   // positional arrays
        case 12: this.s.biqsin.push(...bytes); this.on({ type: 'props', stream: 'biqsin' }); break;
        case 2: case 3: case 4: this.s.graphs[this.stream].push(...bytes); this.on({ type: 'graph', graph: this.stream }); break;
        case 21: case 22: case 23: if (bytes.length === 2) { this.s.graphs[this.stream - 19][bytes[0]] = bytes[1]; this.on({ type: 'graph', graph: this.stream - 19 }); } break;
        case 14: this.s.conv.push(...bytes); this.on({ type: 'conv' }); break;
        case 26: if (bytes.length === 2) { this.s.conv[bytes[0]] = bytes[1]; this.on({ type: 'conv' }); } break;
        case 16: case 17: {    // macro high / low 7 bits, one per macro from i
          const hi = this.stream === 16; this.macroStream = this.macroStream || [];
          for (const b of bytes) {
            const i = this.macroStream.length; this.macroStream.push(b);

    /** Kinetic or BiqBank/SineBank property (e.g. an assignable column's function).

    setBankProp(dialect, which, id, value, current) {

        const a = current.slice(0, 48); a[id] = value;

    },
    /** Several properties at once ([[id, value], ...]): one poke stream, or one legacy replay. */
    setBankProps(dialect, which, pairs, current) {
      if (dialect === 'legacy') {
        if (!current || current.length < 48) throw new Error('the device has not sent these properties yet');
        const a = current.slice(0, 48); pairs.forEach(([id, v]) => a[id] = v);
        return [ccMsg(CH16, 56, which === 'kinet' ? 11 : 12), ...a.map(b => [CHPRESS | CH16, (b || 0) & 127]), ccMsg(CH16, 56, 127)];
      }

    /** Master and other global cc: front ends transmit these on ch1. */

    setConv(dialect, id, value) {

  const LEGACY_SETUP_OK = new Set([91, 92, 93]);

    else if (st === CHPRESS) d = `ch${ch} chPress ${bytes[1]}`;
    else if (st === PROG) d = `ch${ch} program ${bytes[1]}`;
    else if (st === 0x90) d = `ch${ch} note on ${bytes[1]} vel ${bytes[2]}`;
    else if (st === 0x80) d = `ch${ch} note off ${bytes[1]}`;
    else if (st === 0xE0) d = `ch${ch} bend ${(bytes[2] << 7 | bytes[1]) - 8192}`;

    const rd16 = () => { const v = u[p] << 8 | u[p + 1]; p += 2; return v; };

        if (st === 0xFF) { p++; let l = 0; do { b = u[p++]; l = (l << 7) | (b & 127); } while (b & 128); p += l; continue; }
        if (st === 0xF0 || st === 0xF7) { let l = 0; do { b = u[p++]; l = (l << 7) | (b & 127); } while (b & 128); p += l; continue; }

    CH1, CH15, CH16, ROW_NAMES, COL_NAMES, N_ROWS, N_COLS, VALUE_LABELS, VALUE_HELP, CODE, LETTERS,
    isFormulaCode, formulaLetter, cellLabel, parseCellValue, legacyToModernCode, modernToLegacyCode,
    F, SIGN_OF, OPTIONS, COMPONENTS, fget, heightGet, heightSet, formulaSummary, legacyPack, legacyUnpack,
    SETUP, OSC_TYPES, BANK_AB_TYPES, BANK_C_TYPES, SG_TYPES, BANK_COL_LABELS, HARDWARE,

<script>/* Modulators: modules that hide a formula behind a few musical parameters.
 *
 * A modulator owns one formula letter (and, for envelopes and LFOs, one shape generator). Its
 * output cable is that letter placed on a Direct row into the target input. Changing a parameter
 * rewrites the formula. The recipes follow the common techniques in the Osmose Preset Cookbook
 * (Programming Osmose Gestures, and the Tremolo / Vibrato building blocks):
 *   Tap = Z-scaled single-cycle SG pulse; Press = Z only; Aftertouch = Y only; Shake = derivative Z;
 *   Pluck = single-cycle SG ramp down, gated; Sustain = gate with persistence for release;
 *   LFO = continuous SG.
 * Macro modules stand for one macro control each; a cable from a macro is a formula
 * "W constant × macro", recognised again when a preset is read back.
 */
(function (root) {
  'use strict';
  const EM = root.EM;
  const F = EM.F;

  const num = (key, label, min, max, step, def, desc, unit = '') => ({ key, label, type: 'num', min, max, step, def, desc, unit });
  const sel = (key, label, options, def, desc) => ({ key, label, type: 'sel', options, def, desc });
  const RANGE = sel('range', 'Range', ['× 0.001', '× 0.01', '× 0.1', '× 1', '× 10', '× 100'], 3,
    'Multiplies the amount. Noise into a resonator wants tiny values (× 0.001), a frequency in kHz may want × 10.');
  const CURVE = sel('curve', 'Curve', EM.OPTIONS.yzTrans.slice(0, 6), 0, 'How the value follows your finger');
  const AMOUNT = (def = 1) => num('amount', 'Amount', -1, 1, 0.01, def, 'How far the output goes (times the range)');
  const SG_TRIGGER_SHAPES = { 'Pulse': 2, 'Ramp down': 1, 'Triangle': 4, 'Hann': 5, 'Steep S down': 9, 'Gentle S down': 8 };
  const LFO_SHAPES = { 'Sine': 11, 'Triangle': 4, 'Square': 10, 'Ramp up': 0, 'Ramp down': 1, 'Hann': 5, 'Sample & hold': 12 };

  /** A clean formula: every component zero, multipliers × 1, default smoothing. */
  function fresh() {
    const p = {};
    [F.FormOp, F.SgW, F.ScaleW, F.ShapeW, F.SWMacr, F.Persist, F.InitX, F.InitY, F.InitZ, F.TransY, F.TransZ, F.Blend, F.AncOp].forEach(id => p[id] = 0);
    [F.MultW, F.MultX, F.MultY, F.MultZ].forEach(id => p[id] = 3);
    [F.HeightW, F.VBegX, F.VEndX, F.VBegY, F.VEndY, F.VBegZ, F.VEndZ].forEach(id => EM.heightSet(p, id, 0));
    p[F.TransX] = 1; p[F.ZeroX] = 60; p[F.Interp] = 40;
    p[F.HBegX] = 0; p[F.HEndX] = 12; p[F.HBegY] = 0; p[F.HEndY] = 12; p[F.HBegZ] = 0; p[F.HEndZ] = 12;
    return p;
  }
  const h = (p, id, v) => EM.heightSet(p, id, Math.max(-1, Math.min(1, v)));

  // Each gesture: params, whether it needs a shape generator, and build(params, sgSlot) ->
  // { pairs, sg: { type, rate, trigger } } where trigger true = restart on each note (gate).
  const GESTURES = {
    pressure: {
      name: 'Pressure', group: 'Gestures',
      desc: 'Follows how hard you press (Z). Add some aftertouch to keep it rising through the bottom of the key.',
      params: [AMOUNT(), RANGE, CURVE, num('at', 'Aftertouch', 0, 1, 0.01, 0, 'Extra amount added by aftertouch (Y), so the key’s whole travel counts')],
      build(q) {
        const p = fresh(); h(p, F.VEndZ, q.amount); p[F.MultZ] = q.range; p[F.TransZ] = q.curve;
        if (q.at) { h(p, F.VEndY, q.amount * q.at); p[F.MultY] = q.range; p[F.TransY] = q.curve; }
        return { pairs: p };
      },
    },
    aftertouch: {
      name: 'Aftertouch', group: 'Gestures',
      desc: 'Follows the Osmose’s aftertouch zone (Y): nothing until you press into the bottom of the key.',
      params: [AMOUNT(), RANGE, CURVE],
      build(q) { const p = fresh(); h(p, F.VEndY, q.amount); p[F.MultY] = q.range; p[F.TransY] = q.curve; return { pairs: p }; },
    },
    keytrack: {
      name: 'Key tracking', group: 'Gestures',
      desc: 'Rises across the keyboard (X), zero at the centre note. Useful to open a filter or brighten higher notes. Cabled into a Freq input it makes that input follow the played pitch exactly instead.',
      params: [AMOUNT(0.5), RANGE, num('centre', 'Centre note', 24, 96, 1, 60, 'MIDI note where the output is zero (60 = middle C)')],
      build(q) { const p = fresh(); p[F.TransX] = 2; h(p, F.VBegX, -q.amount); h(p, F.VEndX, q.amount); p[F.MultX] = q.range; p[F.ZeroX] = q.centre; return { pairs: p }; },
    },
    gate: {
      name: 'Gate', group: 'Gestures',
      desc: 'On (the amount) while a key is held, off when it is released: W, with no pressure involved.',
      params: [AMOUNT(1), RANGE],
      build(q) { const p = fresh(); p[F.SgW] = 1; h(p, F.HeightW, q.amount); p[F.MultW] = q.range; return { pairs: p }; },
    },
    shake: {
      name: 'Shake', group: 'Gestures',
      desc: 'Responds to how fast the key moves (derivative of Z), not how far: shaking a held key wobbles the output.',
      params: [AMOUNT(0.5), RANGE],
      build(q) { const p = fresh(); p[F.InitZ] = 2; h(p, F.VEndZ, q.amount); p[F.MultZ] = q.range; return { pairs: p }; },
    },
    tap: {
      name: 'Tap / hit', group: 'Envelopes', sg: true,
      desc: 'A short burst at the start of each note, scaled by pressure. Strike the key quickly to hear it; press slowly and it fades away. Classic for exciting a resonator with noise.',
      params: [AMOUNT(1), RANGE, num('rate', 'Speed (Hz)', 1, 18, 0.5, 18, 'Shape generator speed. 9 Hz or more is typical; higher is a shorter hit', 'Hz'),
        sel('shape', 'Shape', Object.keys(SG_TRIGGER_SHAPES), 0, 'Pulse is the sharpest; Ramp down and Hann are softer'),
        num('sens', 'Pressure sens.', 0, 1, 0.01, 1, 'How much the hit depends on striking the key hard (1 = fully, 0 = always the same)'),
        num('ring', 'Ring', 0, 127, 1, 0, 'Persistence: lets the hit decay slowly instead of stopping')],
      build(q, sg) {
        const p = fresh(); p[F.SgW] = 1 + sg; p[F.ShapeW] = SG_TRIGGER_SHAPES[Object.keys(SG_TRIGGER_SHAPES)[q.shape]];
        h(p, F.HeightW, q.amount); p[F.MultW] = q.range; p[F.FormOp] = 1;          // W × (X + Y + Z)
        h(p, F.VBegZ, 1 - q.sens); h(p, F.VEndZ, 1); p[F.Persist] = q.ring;
        return { pairs: p, sg: { type: 1, rate: q.rate, trigger: true } };
      },
    },
    pluck: {
      name: 'Pluck envelope', group: 'Envelopes', sg: true,
      desc: 'Jumps up when a note starts, then decays. How hard you strike sets the level.',
      params: [AMOUNT(1), RANGE, num('decay', 'Decay (s)', 0.05, 10, 0.01, 0.6, 'Time to fall back to zero', 's'),
        sel('shape', 'Shape', ['Ramp down', 'Steep S down', 'Gentle S down'], 0, 'Fall shape'),
        num('vel', 'Velocity', 0, 1, 0.01, 0.6, 'How much the initial pressure sets the level (0 = always full)')],
      build(q, sg) {
        const shapes = [1, 9, 8];
        const p = fresh(); p[F.SgW] = 1 + sg; p[F.ShapeW] = shapes[q.shape];
        h(p, F.HeightW, q.amount); p[F.MultW] = q.range; p[F.FormOp] = 1;
        p[F.InitZ] = 1; h(p, F.VBegZ, 1 - q.vel); h(p, F.VEndZ, 1);               // initial pressure
        return { pairs: p, sg: { type: 1, rate: Math.min(10, 1 / Math.max(0.1, q.decay)), trigger: true } };
      },
    },
    sustain: {
      name: 'Sustain envelope', group: 'Envelopes',
      desc: 'On while a key is held, with a smoothed attack and a release after you let go. Optionally follows pressure.',
      params: [AMOUNT(1), RANGE, num('attack', 'Attack', 0, 127, 1, 40, 'Smoothing (interpolation): higher is a slower rise'),
        num('release', 'Release', 0, 127, 1, 60, 'Persistence: higher holds the sound longer after the key is released'),
        num('press', 'Pressure', 0, 1, 0.01, 0, 'How much it follows pressure while held (0 = steady)'),
        num('at', 'Aftertouch', 0, 1, 0.01, 0, 'Extra amount added by aftertouch (Y), pressing through the bottom of the key')],
      build(q) {
        const p = fresh(); p[F.SgW] = 1; h(p, F.HeightW, q.amount); p[F.MultW] = q.range;
        p[F.Interp] = q.attack; p[F.Persist] = q.release;
        if (q.press > 0) { p[F.FormOp] = 1; h(p, F.VBegZ, 1 - q.press); h(p, F.VEndZ, 1); }
        if (q.at > 0) { h(p, F.VEndY, q.at); p[F.MultY] = q.range; }
        return { pairs: p };
      },
    },
    lfo: {
      name: 'LFO', group: 'Modulators', sg: true,
      desc: 'A repeating wave from a shape generator, for vibrato, tremolo or slow movement. Depth can follow pressure, aftertouch or a macro.',
      params: [num('depth', 'Depth', 0, 1, 0.01, 0.3, 'Size of the wave (times the range)'), RANGE,
        num('rate', 'Rate (Hz)', 0.05, 10, 0.01, 5, 'Speed of the wave', 'Hz'),
        sel('shape', 'Shape', Object.keys(LFO_SHAPES), 0, 'Wave shape'),
        sel('ctl', 'Depth control', ['Fixed', 'Pressure', 'Aftertouch', 'Macro i', 'Macro ii', 'Macro iii', 'Macro iv', 'Macro v', 'Macro vi'], 0, 'What sets how much of the wave you hear'),
        sel('centre', 'Centre', ['Above zero', 'Around zero'], 1, 'Around zero moves both ways (good for vibrato); only with Fixed or Macro depth'),
        sel('sync', 'Key sync', ['Free running', 'Restart each note'], 0, 'Restart the wave when a note starts')],
      build(q, sg) {
        const p = fresh(); p[F.SgW] = 1 + sg; p[F.ShapeW] = LFO_SHAPES[Object.keys(LFO_SHAPES)[q.shape]];
        h(p, F.HeightW, q.depth); p[F.MultW] = q.range;
        if (q.ctl === 1) { p[F.FormOp] = 1; h(p, F.VEndZ, 1); }
        else if (q.ctl === 2) { p[F.FormOp] = 1; h(p, F.VEndY, 1); }
        else if (q.ctl >= 3) { p[F.ScaleW] = 1; p[F.SWMacr] = q.ctl - 3; }
        if (q.centre === 1 && (q.ctl === 0 || q.ctl >= 3)) {   // constant offset through X with a flat range

  // ---------------------------------------------------------------- macros
  /** A formula that is just "constant × macro": a macro cable. Returns the macro index or null. */
  function macroOf(pairs) {
    if (!pairs) return null;
    const g = id => EM.fget(pairs, id);

    const ordered = [...mods.values()].sort((a, b) => (a.kind === 'macro') - (b.kind === 'macro') || (a.kind === 'macro' ? a.index - b.index : 0));
    for (const m of ordered) all.push(describeMod(m));
    const fresh = [];
    for (const n of all) { const p = positions[n.id]; if (p) { n.x = p[0]; n.y = p[1]; NODES.push(n); } else fresh.push(n); }
    let saved = false;
    for (const n of fresh) {
      const x = COL_X[n.kind] ?? 300;
      const below = NODES.filter(o => o.x < x + NODE_W && o.x + NODE_W > x).reduce((y, o) => Math.max(y, o.y + nodeHeight(o) + 18), 24);
      n.x = x; n.y = below; positions[n.id] = [n.x, n.y]; saved = true;

  }
  const srcKey = o => o.src || o.row;           // an output is a matrix row number, or 'm:<id>' for a modulator
  const portIn = new Map(), portOut = new Map(); // col -> {n, i, inp}, src -> {n, i}
  function indexPorts() {
    portIn.clear(); portOut.clear();
    NODES.forEach(n => { n.inputs.forEach((p, i) => portIn.set(p.col, { n, i, inp: p })); n.outputs.forEach((p, i) => portOut.set(srcKey(p), { n, i })); });
  }
  const inXY = col => { const h = portIn.get(col); return h ? [h.n.x, h.n.y + HEAD_H + h.i * ROW_H + ROW_H / 2] : null; };
  const outXY = src => {
    const h = portOut.get(src); if (!h) return null;
    return headerOut(h.n) ? [h.n.x + NODE_W, h.n.y + HEAD_H / 2 - 2] : [h.n.x + NODE_W, h.n.y + HEAD_H + h.i * ROW_H + ROW_H / 2];

  const isControlRow = r => typeof r === 'string' || r >= 13;

  function isDialInput(col) {

    const n = MOD.describeNode(d, S);
    const inp = n.inputs.find(i => i.col === col);
    return !!inp && inp.kind === 'ctl';
  }
  /** Modulators used as a VCA: col -> the modulator whose letter is on that column's × row. */
  function vcaByCol() {
    const out = new Map(), own = ownedLetters();
    for (const [k, c] of S.cells) {
      const [r, col] = EM.unkey(k); if (r !== 16) continue;
      const src = cableSource(16, c);
      if (typeof src === 'string') { const m = mods.get(src.slice(2)); if (m && m.ins && m.ins.length) out.set(col, m); }

  /** A signal cell that is really "source → modulator In" (drawn into the modulator, not to the column). */
  const isVcaFeed = (r, c, vb) => { const m = (vb || vcaByCol()).get(c); return !!m && r !== 16 && m.ins.includes(r); };
  const isHiddenCell = (r, c, cell, vb) => (MOD.isDialCell(r, cell) && isDialInput(c)) || isVcaFeed(r, c, vb);
  /** Where a cell's cable is drawn from: a modulator / macro that owns its formula, or its matrix row. */
  function cableSource(r, cell) {
    if (r >= 13 && r <= 16) {

      if (EM.isFormulaCode(n)) {

  const fmtVal = v => { const a = Math.abs(v); return (a >= 10 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : v.toFixed(3)).replace(/\.?0+$/, '') || '0'; };

  // ======================================================================= SVG rendering
  const svg = $('#canvas');

  let gRoot, gNodes, gCables, gPorts, gChips, tempPath;
  function applyView() { gRoot.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }

  function cablePath(a, b) {

  function renderAll() {

    svg.append(gRoot);

    renderHeader();
    renderPalette();

  }

  /** A knob. spec: {key, label, desc, min, max, unit, get(), set(v), nudge(steps), type(), text?, blocked?} */
  function knob(spec, y) {
    const v = spec.get();
    const span = spec.max - spec.min, tt = x => Math.max(0, Math.min(1, (x - spec.min) / span));
    const t = tt(v), tz = tt(Math.max(spec.min, Math.min(spec.max, 0)));   // bipolar dials draw their arc from zero
    const cx = NODE_W - 16, cy = y, r = 8.5;
    const ang = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    const a0 = -0.75 * Math.PI, a1 = a0 + t * 1.5 * Math.PI;
    const [sx, sy] = ang(a0), [ex, ey] = ang(a1), [mx, my] = ang(0.75 * Math.PI);
    const g = el('g', { class: 'knob' + (v !== 0 ? ' set' : '') + (spec.blocked ? ' blocked' : ''), 'data-knob': spec.key,
      'data-tip': `${spec.label}\n${spec.desc ? spec.desc + '\n' : ''}Now ${fmtVal(v)}${spec.unit ? ' ' + spec.unit : ''} (${spec.min} to ${spec.max}). Drag up or down, Shift for fine steps, scroll, or double-click to type.` });
    g.append(el('circle', { class: 'face', cx, cy, r: r + 2 }));
    g.append(el('path', { class: 'track', d: `M${sx},${sy} A${r},${r} 0 1 1 ${mx},${my}` }));
    if (Math.abs(t - tz) > 0.003) {
      const lo = Math.min(t, tz), hi = Math.max(t, tz);
      const [lx, ly] = ang(a0 + lo * 1.5 * Math.PI), [hx, hy] = ang(a0 + hi * 1.5 * Math.PI);
      g.append(el('path', { class: 'arc', d: `M${lx},${ly} A${r},${r} 0 ${(hi - lo) * 1.5 * Math.PI > Math.PI ? 1 : 0} 1 ${hx},${hy}` }));

    g.addEventListener('pointerdown', e => startKnobDrag(e, spec));

    return [g, el('text', { class: 'kval' + (v !== 0 || spec.text ? ' set' : ''), x: NODE_W - 30, y: y + 4, 'text-anchor': 'end', text: txt })];
  }
  /** A bank column assigned to a property: its dial is that property's value (the same one as in

  const propGet = inp => MOD.propToValue(inp.prop, S[inp.propStream]?.[inp.propIndex] ?? 0);
  function propSet(inp, v) {
    const raw = MOD.propFromValue(inp.prop, v);

  }
  function propKnob(inp) {
    const offset = MOD.dialValue(S, inp.col);

      min: inp.min, max: inp.max, step: inp.step, get: () => propGet(inp), set: v => propSet(inp, v),
      nudge: k => propSet(inp, propGet(inp) + k * inp.step), type: () => { const t = prompt(`${inp.label} (${inp.min} to ${inp.max})`, fmtVal(propGet(inp))); if (t !== null && t.trim() !== '' && !isNaN(+t)) propSet(inp, +t); } };
  }
  /** Knob spec for a module input: its constant, stored on the Direct rows. */

  function renderNode(n) {

  /** Short chip text for a cable: a macro cable shows its amount, a modulator cable its letter. */
  function chipLabel(src, cell) {

  let renderQueued = false;
  function scheduleRender(full) {
    if (renderQueued) return; renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; renderAll(); if (full !== false) renderInspector(); });
  }

  /** Pan just enough to bring a node into view. */
  function ensureVisible(n) {
    if (!n) return;
    const r = svg.getBoundingClientRect(), pad = 20;
    const x0 = n.x * view.k + view.x, y0 = n.y * view.k + view.y, x1 = x0 + NODE_W * view.k, y1 = y0 + nodeHeight(n) * view.k;

    if (x1 > r.width - pad) dx = r.width - pad - x1; if (x0 + dx < pad) dx = pad - x0;
    if (y1 > r.height - pad) dy = r.height - pad - y1; if (y0 + dy < pad) dy = pad - y0;
    if (dx || dy) { view.x += dx; view.y += dy; applyView(); store.set('view', view); }
  }
  /** Zoom and pan so every module is visible. */
  function fitView() {
    if (!NODES.length) return;
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    NODES.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + NODE_W); y1 = Math.max(y1, n.y + nodeHeight(n)); });
    const pad = 30, k = Math.max(0.3, Math.min(1.2, (r.width - 2 * pad) / (x1 - x0), (r.height - 2 * pad - 40) / (y1 - y0)));
    view.k = k; view.x = pad - x0 * k + Math.max(0, (r.width - 2 * pad - (x1 - x0) * k) / 2); view.y = pad - y0 * k;

  // After a preset arrives, fit once the burst of messages settles.
  let fitTimer = null, fitArmed = false;
  function fitSoon(arm) {

    if (!fitArmed) return;
    clearTimeout(fitTimer);
    fitTimer = setTimeout(() => { fitArmed = false; renderAll(); fitView(); }, 300);
  }

  function renderHeader() {

${it.desc || ''}${res.error ? '\nNot available: ' + res.error : ''}`, 'data-key': it.key, onclick: () => addModule(it) },

  function availability(it, osm = MOD.osmoseLike(S, portName)) {

    if (!res.error && it.type?.osmoseUnsupported && osm) res = { error: 'Not available on the Osmose', short: 'not on the Osmose' };

  /** Put a new module's top-left corner at `at` (world coordinates), or under its column when not given. */

  function addModule(it, at) {
    if (it.kind === 'gesture' || it.kind === 'macro') {

  // ======================================================================= right-click menu on the canvas

  let ctxMenu = null;

  function removeModule(id) {
    if (mods.has(id)) return removeMod(mods.get(id));

    // Anything this module fed into a modulator's In goes too, so it can't come back on a later cable.
    for (const m of mods.values()) for (const r of def.rows) if (m.ins && m.ins.includes(r)) disconnectModIn(m, r);
    const cells = [...S.cells.keys()].map(EM.unkey).filter(([r, c]) => def.rows.includes(r) || def.cols.includes(c));
    cells.forEach(([r, c]) => setCell(r, c, null));

      if (!drag.moved && Math.abs(x - n.x) + Math.abs(y - n.y) < 3) return;

  function select(s) { selected = s; scheduleRender(); if (s?.kind === 'cable') requestFormulaIfNeeded(s.row, s.col); }

  // ======================================================================= editing operations
  const pendingLetters = new Set();   // letters handed out but not yet in a cell (e.g. a modulator with no cable yet)
  function usedFormulaNumbers() {
    const used = new Set();
    for (const c of S.cells.values()) if (EM.isFormulaCode(c.code & 63)) used.add(c.code & 63);
    return used;
  }
  function freeFormula() {
    const used = usedFormulaNumbers();
    for (const n of ownedLetters().keys()) used.add(n);
    for (const n of pendingLetters) used.add(n);
    const max = dialect() === 'modern' ? 44 : 22;
    for (let n = 1; n <= max; n++) if (!used.has(n)) return n;
    return null;
  }
  function connect(row, col) {
    if (typeof col === 'string' && col.startsWith('mi:')) return connectModIn(row, mods.get(col.slice(3)));
    if (typeof row === 'string') return connectMod(mods.get(row.slice(2)), col);
    const k = EM.key(row, col);
    const existing = S.cells.get(k);
    if (existing && isHiddenCell(row, col, existing)) {
      // The Direct row holds this input's dial value: move the value to the other dial rows first.
      const v = MOD.dialValue(S, col); setCell(row, col, null);
      S.cells.set(k, { code: 63, dec: 0 });                 // placeholder so dialWrites skips this row
      const w = MOD.dialWrites(S, col, v); S.cells.delete(k);

    let cell;
    if (isControlRow(row)) {
      const n = freeFormula();
      if (n) {
        cell = { code: n, dec: 0 };
        // Start the letter from a clean, silent state so leftovers on the device do not surprise you.
        const fresh = {};
        [EM.F.FormOp, EM.F.SgW, EM.F.ScaleW, EM.F.ShapeW].forEach(id => fresh[id] = 0);
        [EM.F.MultW, EM.F.MultX, EM.F.MultY, EM.F.MultZ].forEach(id => fresh[id] = 3);
        [EM.F.HeightW, EM.F.VBegX, EM.F.VEndX, EM.F.VBegY, EM.F.VEndY, EM.F.VBegZ, EM.F.VEndZ].forEach(id => EM.heightSet(fresh, id, 0));
        const prev = S.formulas[n]?.pairs || {};

    } else cell = { code: EM.CODE.ONE, dec: 0 };

  // ---- modulators and macros
  /** Put a formula letter on a free Direct row into col, keeping the input's dial value. Returns the row or null. */
  function placeOnDirect(col, letter) {
    for (const r of [13, 14]) {
      const cur = S.cells.get(EM.key(r, col));
      if (cur && (cur.code & 63) === letter) return r;
      if (cur && !MOD.isDialCell(r, cur)) continue;
      const v = MOD.dialValue(S, col);
      setCell(r, col, { code: letter, dec: 0 });
      for (const [rr, c] of MOD.dialWrites(S, col, v)) setCell(rr, col, c);
      return r;
    }
    return null;
  }
  function connectMod(m, col) {
    if (!m) return;
    // Key tracking into a frequency input means "play in tune": that is X itself, not a scaled formula
    // (a formula's output is linear, so the notes would bunch up like overtones).
    const inp = portIn.get(col)?.inp;
    if (m.kind === 'gesture' && m.g === 'keytrack' && inp?.follow === MOD.FOLLOW_X) {
      setFollow(inp, true);
      setStatus(`${inp.label} now follows the played pitch exactly (X), a semitone per key.`, 'ok');
      return;
    }
    let letter;
    if (m.kind === 'gesture') letter = m.letter;
    else {
      letter = freeFormula();
      if (!letter) { setStatus('No free formula letters left for another macro cable.', 'warn'); return; }
      const pairs = MODS.macroFormula(m.index, 1);
      S.formulas[letter] = { pairs };
      sendFormula(letter, pairs, pairs, null, null);
    }
    if (m.ins && m.ins.length) return placeVca(m, col, letter);
    const r = placeOnDirect(col, letter);
    if (r === null) { setStatus('Both Direct rows into that input already carry cables.', 'warn'); return; }
    pendingLetters.delete(letter);
    logInfo(`Connected ${describeMod(m).title} → ${EM.COL_NAMES[col]} (formula ${EM.formulaLetter(letter)})`);
    select({ kind: 'cable', row: r, col });
  }
  // ---- modulators as VCAs: out = In × modulator. In EaganMatrix terms the In signals go on the
  // destination column's own rows and the modulator's letter on its × (Multiply) row.
  function placeVca(m, col, letter) {
    const cur = S.cells.get(EM.key(16, col));
    if (cur && (cur.code & 63) !== letter) {
      setStatus('That input is already scaled by something else. The Osmose has one × row per input, so only one modulator can scale it.', 'warn');
      if (m.kind === 'macro') { delete S.formulas[letter]; }
      return false;
    }
    setCell(16, col, { code: letter, dec: 0 });
    for (const r of m.ins) if (!S.cells.get(EM.key(r, col))) setCell(r, col, { code: EM.CODE.ONE, dec: 0 });
    pendingLetters.delete(letter);
    const other = [...S.cells.keys()].map(EM.unkey).filter(([r, c]) => c === col && r !== 16 && !m.ins.includes(r) && !MOD.isDialCell(r, S.cells.get(EM.key(r, c))));
    logInfo(`${describeMod(m).title} scales → ${EM.COL_NAMES[col]} (formula ${EM.formulaLetter(letter)} on the × row)`);
    setStatus(other.length ? `Connected. Note: the other ${other.length} cable${other.length > 1 ? 's' : ''} into this input ${other.length > 1 ? 'are' : 'is'} scaled too (the × row multiplies the whole input).` : 'Connected: this input now gets In × the modulator.', other.length ? 'warn' : 'ok');
    select({ kind: 'cable', row: 16, col });
    return true;
  }
  /** Where a modulator's output goes: [row, col] cells drawn from it. */
  const modOuts = m => modCells(m);
  function connectModIn(src, m) {
    if (!m) return;
    if (typeof src === 'string') { setStatus('A modulator’s In takes an audio signal (an oscillator, bank, noise…), not another modulator.', 'warn'); return; }
    if (isControlRow(src)) { setStatus('Plug an audio signal into In. To combine control signals, cable both to the same input.', 'warn'); return; }
    m.ins = m.ins || [];
    if (m.ins.includes(src)) return;
    const wasVca = m.ins.length > 0;
    m.ins.push(src);
    if (wasVca) {
      for (const [r, c] of modOuts(m)) if (r === 16 && !S.cells.get(EM.key(src, c))) setCell(src, c, { code: EM.CODE.ONE, dec: 0 });
    } else {
      // Its direct outputs become scaled ones: the letter moves from the Direct row to the × row.
      for (const [r, c] of modOuts(m)) {
        const cell = S.cells.get(EM.key(r, c)), letter = cell.code & 63;
        setCell(r, c, null);
        for (const [rr, cc] of MOD.dialWrites(S, c, MOD.dialValue(S, c))) setCell(rr, c, cc);
        if (!placeVca(m, c, letter)) { /* × row taken: that output is dropped */ }
      }
    }
    if (!wasVca && m.kind === 'gesture') applyGesture(m, false);
    logInfo(`${EM.ROW_NAMES[src]} → ${describeMod(m).title} In`);
    scheduleRender();
  }
  function disconnectModIn(m, src) {
    const outs = modOuts(m).filter(([r]) => r === 16);
    for (const [, c] of outs) { const k = EM.key(src, c), cell = S.cells.get(k); if (cell) setCell(src, c, null); }
    m.ins = m.ins.filter(r => r !== src);
    if (!m.ins.length) {
      // Back to a plain modulator: its letter moves from the × row to a Direct row.
      for (const [, c] of outs) { const letter = S.cells.get(EM.key(16, c)).code & 63; setCell(16, c, null); placeOnDirect(c, letter); }
      if (m.kind === 'gesture') applyGesture(m, false);
    }
    if (selected?.kind === 'modin') selected = null;
    scheduleRender();
  }
  /** Delete a cable; a scaled (× row) cable also takes its In signals out of that input. */
  function deleteCable(row, col) {
    const cell = S.cells.get(EM.key(row, col));
    if (row === 16 && cell) {
      const src = cableSource(16, cell), m = typeof src === 'string' && mods.get(src.slice(2));
      if (m && m.ins) for (const r of m.ins) if (S.cells.get(EM.key(r, col))) setCell(r, col, null);
    }
    setCell(row, col, null);
  }
  function freeSg() {
    const taken = new Set([...placed, ...ownedSgs()]);
    for (let k = 1; k <= 5; k++) if (!taken.has('sg' + k)) return k;
    return null;
  }
  /** Can this palette item be added now? {ok} or {error, short}. */
  function modAvailability(it) {
    if (it.kind === 'macro') {
      if (it.index === null) {
        if (dialect() === 'legacy') return { error: 'Macros m7 to m90 need newer firmware', short: 'newer firmware only' };
        for (let i = 6; i < 90; i++) if (!mods.has('macro' + i)) return { index: i };
        return { error: 'All macros are in the patch', short: 'all added' };
      }
      return mods.has('macro' + it.index) ? { error: 'Already in the patch', short: 'already added' } : { index: it.index };
    }
    if (!freeFormula()) return { error: 'No free formula letters left', short: 'no free formula' };
    if (it.sg && !freeSg()) return { error: 'All 5 shape generators are in use', short: 'no free shape generator' };
    return {};
  }
  function addGesture(g) {
    const letter = freeFormula(), sg = MODS.GESTURES[g].sg ? freeSg() : null;
    let n = 1; while (mods.has('mod' + n)) n++;
    const m = { id: 'mod' + n, kind: 'gesture', g, letter, sg, params: MODS.defaults(g) };
    mods.set(m.id, m); pendingLetters.add(letter);
    applyGesture(m, true);
    return m;
  }
  /** Write a modulator's formula (and its shape generator settings) from its parameters. */
  function applyGesture(m, full) {
    const out = MODS.GESTURES[m.g].build(m.params, m.sg);
    // As a VCA (something in its In), a modulator that doesn't use W is gated by the key (W = 1 while
    // held): out = W × (…). Without it, a voice whose key is up could still leak a little signal.
    const P = out.pairs;
    if (m.ins && m.ins.length && !P[EM.F.SgW] && !P[EM.F.FormOp] && !EM.heightGet(P, EM.F.HeightW)) {
      P[EM.F.SgW] = 1; EM.heightSet(P, EM.F.HeightW, 1); P[EM.F.MultW] = 3; P[EM.F.FormOp] = 1;
    }
    if (full) {
      S.formulas[m.letter] = { pairs: out.pairs };
      sendFormula(m.letter, out.pairs, out.pairs, null, cellUsing(m.letter));
    } else editFormula(m.letter, p => { for (const k of Object.keys(p)) if (!(k in out.pairs)) delete p[k]; Object.assign(p, out.pairs); });
    if (out.sg && m.sg) {
      const def = DEFS['sg' + m.sg], cur = S.setup[def.typeId] ?? 0;
      if (full || (cur & 3) !== out.sg.type) setSetup(def.typeId, (cur & ~3) | out.sg.type);
      const fcol = def.cols[0], tcol = def.cols[1];
      if (Math.abs(MOD.dialValue(S, fcol) - out.sg.rate) > 1e-4) setSgRate(fcol, out.sg.rate);
      // Restart each note: the gate (W) triggers it. Free running: a constant 1, so it starts with
      // every voice and keeps cycling (with no trigger at all it never starts).
      const t = S.cells.get(EM.key(13, tcol)), want = out.sg.trigger ? 45 : 50;
      if (!t || (t.code & 63) !== want) setCell(13, tcol, { code: want, dec: 0 });
    }
  }
  /** A modulator's shape generator speed: constants into the SG's F column, up to 18 Hz (9 + 9). */
  function setSgRate(col, v) {
    v = Math.round(Math.max(0, Math.min(18, v)) * 100) / 100;
    const want = { 13: null, 14: null, 15: null };
    let rest = v; if (v > 9) { want[13] = { code: 58, dec: 0 }; rest = Math.round((v - 9) * 100) / 100; }
    Object.assign(want, MOD.encodeDial(rest, [14, 15]).cells);
    for (const r of [13, 14, 15]) {
      const cur = S.cells.get(EM.key(r, col)), w = want[r];
      const same = (!cur && !w) || (cur && w && cur.code === w.code && (cur.dec || 0) === (w.dec || 0));
      if (!same) queueCell(r, col, w);
    }
  }
  function setModParam(m, key, v) {
    if (m.kind === 'macro') return setMacroValue(m.index, v);
    const spec = MODS.GESTURES[m.g].params.find(p => p.key === key);
    if (spec.type === 'num') v = Math.round(Math.max(spec.min, Math.min(spec.max, v)) / spec.step) * spec.step;
    v = Math.round(v * 10000) / 10000;
    if (m.params[key] === v) return;
    m.params[key] = v;
    applyGesture(m, false);
    scheduleRender(false);
  }
  function macroValue(i) { const raw = S.macros[i]; return raw === undefined ? 0 : Math.round(EM.macroToValue(i, raw) * 1000) / 1000; }
  const pendingMacros = new Map(); let macroTimer = null;
  function setMacroValue(i, v) {
    v = Math.max(i < 6 ? 0 : -1, Math.min(1, v));
    S.macros[i] = EM.macroFromValue(i, v);
    pendingMacros.set(i, v);
    if (!macroTimer) macroTimer = setTimeout(() => { macroTimer = null; for (const [j, x] of pendingMacros) midiSend(EM.Encoder.setMacro(j, x)); pendingMacros.clear(); }, 30);
    scheduleRender(false);
  }
  /** Cells drawn from a modulator / macro. */
  function modCells(m) {
    const out = [];
    for (const [k, c] of S.cells) { const [r, col] = EM.unkey(k); if (cableSource(r, c) === 'm:' + m.id) out.push([r, col]); }
    return out;
  }
  function removeMod(m) {
    const cells = modCells(m);
    for (const [r, c] of cells) if (r === 16 && m.ins) for (const s2 of m.ins) if (S.cells.get(EM.key(s2, c))) cells.push([s2, c]);
    cells.forEach(([r, c]) => setCell(r, c, null));
    if (m.sg) { const d = DEFS['sg' + m.sg]; for (const [k] of [...S.cells]) { const [r, c] = EM.unkey(k); if (d.cols.includes(c)) setCell(r, c, null); } }
    pendingLetters.delete(m.letter);
    mods.delete(m.id); if (m.kind === 'macro') dismissedMacros.add(m.index);
    if (selected?.kind === 'node' && selected.id === m.id) selected = null;
    scheduleRender();
  }

  /** Swap the contents of two Osc/Filter slots: types, options and every cable and dial. */
  function swapOscSlots(a, b) {
    if (a === b) return;
    const A = DEFS['osc' + a], B = DEFS['osc' + b];
    for (const k of ['typeId', 'optId', 'exId']) {
      const va = S.setup[A[k]] ?? 0, vb = S.setup[B[k]] ?? 0;
      if (va !== vb) { setSetup(A[k], vb); setSetup(B[k], va); }
    }
    const colMap = new Map(), rowMap = new Map([[A.rows[0], B.rows[0]], [B.rows[0], A.rows[0]]]);
    A.cols.forEach((c, i) => { colMap.set(c, B.cols[i]); colMap.set(B.cols[i], c); });
    const moved = new Map();
    for (const [k, c] of S.cells) { const [r, cc] = EM.unkey(k); moved.set(EM.key(rowMap.get(r) ?? r, colMap.get(cc) ?? cc), c); }
    const keys = new Set([...S.cells.keys(), ...moved.keys()]);
    for (const k of keys) { const o = S.cells.get(k), nw = moved.get(k); if (o !== nw) { const [r, c] = EM.unkey(k); setCell(r, c, nw || null); } }
    const ha = placed.has(A.id), hb = placed.has(B.id);
    placed.delete(A.id); placed.delete(B.id);
    if (ha) placed.add(B.id); if (hb) placed.add(A.id);
    if (selected?.kind === 'node') selected = { kind: 'node', id: selected.id === A.id ? B.id : selected.id === B.id ? A.id : selected.id };
    else if (selected?.kind === 'cable') selected = null;
    scheduleRender();
  }
  function moveToSlot(from, to) { swapOscSlots(from, to); logInfo(`Moved slot ${from} to slot ${to}`); }
  /** Make the Jenny in slot j follow the oscillator in slot s, by moving them next to each other. */
  function setJennySource(j, s) {
    if (j > 1) { swapOscSlots(s, j - 1); return; }
    if (s < 5) { swapOscSlots(1, s + 1); return; }
    swapOscSlots(1, 5); swapOscSlots(1, 4);   // Jenny to 5, the oscillator to 4
  }
  function setCell(row, col, cell) {
    const k = EM.key(row, col);
    if (cell && (cell.code & 63)) S.cells.set(k, cell); else S.cells.delete(k);
    try { midiSend(EM.Encoder.setCell(dialect(), row, col, cell)); }
    catch (err) { logInfo('Not sent: ' + err.message); }
    if (!cell && selected?.kind === 'cable' && selected.row === row && selected.col === col) selected = null;
    scheduleRender();
  }
  function setMute(row, col, muted) {
    const k = EM.key(row, col), cell = S.cells.get(k);
    if (!cell) return;
    cell.code = (cell.code & 63) | (muted ? 64 : 0);
    midiSend(EM.Encoder.setMute(dialect(), row, col, cell, muted));
    scheduleRender();
  }
  const unsentSetup = new Set();  // settings shown here that the device could not be told about
  function setSetup(id, value) {
    let msgs;
    try { msgs = EM.Encoder.setSetup(dialect(), id, value); }
    catch (err) {
      S.setup[id] = value;
      if (midi.out) { logInfo('Not sent: ' + err.message); setStatus('Not sent: ' + err.message, 'warn'); unsentSetup.add(id); }
      scheduleRender(); return false;
    }
    S.setup[id] = value; unsentSetup.delete(id); midiSend(msgs);
    scheduleRender();
    return true;
  }
  // ---- dials: a control input's constant value, written as matrix constants on the Direct rows
  const pendingCells = new Map(); // key -> cell|null
  let cellFlushQueued = false;
  function queueCell(row, col, cell) {
    const k = EM.key(row, col);
    if (cell) S.cells.set(k, cell); else S.cells.delete(k);
    pendingCells.set(k, cell);
    if (!cellFlushQueued) {
      cellFlushQueued = true;
      setTimeout(() => {
        cellFlushQueued = false;
        const d = dialect();
        for (const [kk, c] of pendingCells) { const [r, cc] = EM.unkey(kk); try { midiSend(EM.Encoder.setCell(d, r, cc, c)); } catch (err) { logInfo('Not sent: ' + err.message); } }
        pendingCells.clear();
      }, 30);
    }
  }
  const snap = (v, inp) => { const st = Math.max(0.0001, (inp.step || 0.01)); return Math.round(Math.max(inp.min, Math.min(inp.max, v)) / st) * st; };
  function setDial(inp, v) {
    const col = inp.col;
    if (!MOD.dialAvailable(S, col)) { setStatus('The Direct rows into this input are all used by cables, so there is no room for a dial value.', 'warn'); return; }
    v = Math.round((snap(v, inp) + detuneOf(col)) * 10000) / 10000;
    for (const [r, cell] of MOD.dialWrites(S, col, v)) queueCell(r, col, cell);
    scheduleRender(false);
    const f = document.querySelector(`#inspector input[data-dial="${col}"]`); if (f && document.activeElement !== f) f.value = fmtVal(MOD.dialValue(S, col));
  }
  function nudgeDial(inp, steps) {
    const span = inp.max - inp.min;
    setDial(inp, coarseDial(inp.col) + steps * Math.max(inp.step || 0.01, span / 100));
  }
  function typeDial(inp) {
    const t = prompt(`${inp.label} (${inp.min} to ${inp.max}${inp.unit ? ' ' + inp.unit : ''})`, fmtVal(MOD.dialValue(S, inp.col)));
    if (t === null || t.trim() === '' || isNaN(+t)) return;
